version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active-upstream.conf:/etc/nginx/conf.d/active-upstream.conf:rw
    depends_on:
      - app_blue
    restart: always
    networks:
      - app-net

  app_blue:
    build:
      context: ./app
    container_name: app_blue
    environment:
      - PORT=3000
      - APP_COLOR=blue
      - APP_VERSION=1.0.0
    ports:
      - "8081:3000"
    restart: always
    networks:
      - app-net

  app_green:
    build:
      context: ./app
    container_name: app_green
    environment:
      - PORT=3000
      - APP_COLOR=green
      - APP_VERSION=2.0.0
    ports:
      - "8082:3000"
    restart: always
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
